                {'id':'va0428821760', 'room':'Arbeitszimmer'},
                {'id':'va4219555072', 'room':'Lenya'},
                {'id':'va2543013120', 'room':'Malin'},
                {'id':'va0244534528', 'room':'Malin'}
              ] %}
              {% set ns = namespace(level='OK', message='Alles in Ordnung.') %}
              {% for d in devices %}
                {% set cloud = states('binary_sensor.tado_smart_radiator_thermostat_' ~ d.id ~ '_cloud_verbindung') %}
                {% if ns.level != 'Fehler' and cloud != 'on' %}
                  {% set ns.level = 'Fehler' %}
                  {% if cloud in ['unknown', 'unavailable', 'none', ''] %}
                    {% set ns.message = 'Cloud-Verbindung unbekannt: ' ~ d.room ~ ' (' ~ (d.id | upper) ~ ')' %}
                  {% else %}
                    {% set ns.message = 'Cloud-Verbindung unterbrochen: ' ~ d.room ~ ' (' ~ (d.id | upper) ~ ')' %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {% if ns.level == 'OK' %}
                {% for d in devices %}
                  {% set battery = states('binary_sensor.tado_smart_radiator_thermostat_' ~ d.id ~ '_batterie') %}
                  {% if ns.level == 'OK' and battery == 'on' %}
                    {% set ns.level = 'Warnung' %}
                    {% set ns.message = 'Batterie-Warnung: ' ~ d.room ~ ' (' ~ (d.id | upper) ~ ')' %}
                  {% endif %}
                {% endfor %}
              {% endif %}
              {{ ns.level }} — {{ ns.message }}
            secondary: Tado Thermostate · Cloud und Batterien
            icon: mdi:home-thermometer-outline
            icon_color: >-
              {% set devices = [
                {'id':'va3984081408'},
                {'id':'va0428821760'},
                {'id':'va4219555072'},
                {'id':'va2543013120'},
                {'id':'va0244534528'}
              ] %}
              {% set ns = namespace(level='OK') %}
              {% for d in devices %}
                {% set cloud = states('binary_sensor.tado_smart_radiator_thermostat_' ~ d.id ~ '_cloud_verbindung') %}
                {% if ns.level != 'Fehler' and cloud != 'on' %}
                  {% set ns.level = 'Fehler' %}
                {% endif %}
              {% endfor %}
              {% if ns.level == 'OK' %}
                {% for d in devices %}
                  {% if is_state('binary_sensor.tado_smart_radiator_thermostat_' ~ d.id ~ '_batterie', 'on') %}
                    {% set ns.level = 'Warnung' %}
                  {% endif %}
                {% endfor %}
              {% endif %}
              {% if ns.level == 'Fehler' %}var(--zs7-crit)
              {% elif ns.level == 'Warnung' %}var(--zs7-warn)
              {% else %}var(--zs7-ok){% endif %}

