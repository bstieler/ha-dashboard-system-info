      - type: grid
        title: PV Status
        cards:
          - type: custom:mushroom-template-card
            primary: >-
              {% set required_entities = [
                'sensor.alpha_ess_actual_production',
                'sensor.alpha_ess_actual_house_consumption',
                'sensor.pv_battery_soc',
                'sensor.alpha_ess_total_power_grid',
                'sensor.alpha_ess_system_fault',
                'sensor.zs7_energy_pv_to_sunset_forecast_kwh'
              ] %}
              {% set missing = namespace(items=[]) %}
              {% for entity_id in required_entities %}
                {% set value = states(entity_id) %}
                {% if value in ['unknown', 'unavailable', 'none', ''] %}
                  {% set missing.items = missing.items + [entity_id] %}
                {% endif %}
              {% endfor %}
              {% set fault_entities = [
                'sensor.alpha_ess_inverter_fault_1',
                'sensor.alpha_ess_inverter_fault_2',
                'sensor.alpha_ess_inverter_extended_fault_1',
                'sensor.alpha_ess_inverter_extended_fault_2',
                'sensor.alpha_ess_system_fault'
              ] %}
              {% set fault = namespace(active='') %}
              {% for entity_id in fault_entities %}
                {% set raw = states(entity_id) %}
                {% if fault.active == '' and raw not in ['unknown', 'unavailable', 'none', ''] and (raw | float(0)) != 0 %}
                  {% set fault.active = entity_id %}
                {% endif %}
              {% endfor %}
              {% set soc = states('sensor.pv_battery_soc') | float(0) %}
              {% set min_temp = states('sensor.alpha_ess_battery_min_cell_temp') | float(0) %}
              {% set max_temp = states('sensor.alpha_ess_battery_max_cell_temp') | float(0) %}
              {% set pv = states('sensor.alpha_ess_actual_production') | float(0) %}
              {% set grid = states('sensor.alpha_ess_total_power_grid') | float(0) %}
              {% if missing.items | count > 0 %}
              Fehler — Kernsensoren fehlen: {{ missing.items[0] }}
              {% elif fault.active != '' %}
              Fehler — Fehlerregister aktiv: {{ state_attr(fault.active, 'friendly_name') or fault.active }}
              {% elif soc < 20 %}
              Warnung — Batterie-SOC niedrig: {{ soc | round(1) }} %
              {% elif min_temp <= 0 or max_temp >= 45 %}
              Warnung — Batterietemperatur auffaellig: {{ min_temp | round(1) }} bis {{ max_temp | round(1) }} °C
              {% elif is_state('sun.sun', 'above_horizon') and pv > 500 and grid > 1500 %}
              Warnung — Trotz PV aktuell hoher Netzbezug: {{ grid | round(0) }} W
              {% else %}
              OK — PV-Anlage arbeitet ohne erkennbare Auffaelligkeit
              {% endif %}
            secondary: AlphaESS · Erzeugung, Batterie, Netz
            icon: mdi:solar-power-variant-outline
            icon_color: >-
              {% set required_entities = [
                'sensor.alpha_ess_actual_production',
                'sensor.alpha_ess_actual_house_consumption',
                'sensor.pv_battery_soc',
                'sensor.alpha_ess_total_power_grid',
                'sensor.alpha_ess_system_fault',
                'sensor.zs7_energy_pv_to_sunset_forecast_kwh'
              ] %}
              {% set missing = namespace(items=[]) %}
              {% for entity_id in required_entities %}
                {% set value = states(entity_id) %}
                {% if value in ['unknown', 'unavailable', 'none', ''] %}
                  {% set missing.items = missing.items + [entity_id] %}
                {% endif %}
              {% endfor %}
              {% set soc = states('sensor.pv_battery_soc') | float(-1) %}
              {% set fault = namespace(active=false) %}
              {% for entity_id in [
                'sensor.alpha_ess_inverter_fault_1',
                'sensor.alpha_ess_inverter_fault_2',
                'sensor.alpha_ess_inverter_extended_fault_1',
                'sensor.alpha_ess_inverter_extended_fault_2',
                'sensor.alpha_ess_system_fault'
              ] %}
                {% set raw = states(entity_id) %}
                {% if not fault.active and raw not in ['unknown', 'unavailable', 'none', ''] and (raw | float(0)) != 0 %}
                  {% set fault.active = true %}
                {% endif %}
              {% endfor %}
              {% if missing.items | count > 0 or fault.active %}var(--zs7-crit)
              {% elif soc >= 0 and soc < 20 %}var(--zs7-warn)
              {% else %}var(--zs7-ok){% endif %}

