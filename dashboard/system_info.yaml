title: System
views:
  - title: System
    type: sections
    theme: zs7
    path: system-info
    icon: mdi:server-outline
    max_columns: 3
    header:
      card:
        type: heading
        heading: System
        subheading: Raspberry Pi · Releases · API Status
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Raspberry Pi
            heading_style: title
            icon: mdi:raspberry-pi
          - type: custom:mushroom-entity-card
            entity: sensor.processor_use
            name: Prozessorlast
            icon: mdi:chart-line
            grid_options:
              columns: 6
          - type: custom:mushroom-entity-card
            entity: sensor.processor_temperature
            name: Prozessortemperatur
            icon: mdi:thermometer
            grid_options:
              columns: 6
          - type: custom:mushroom-entity-card
            entity: sensor.memory_usage
            name: Speichernutzung
            icon: mdi:memory
            grid_options:
              columns: 6
          - type: custom:mushroom-entity-card
            entity: sensor.disk_free
            name: Festplatte frei (/)
            icon: mdi:harddisk
            grid_options:
              columns: 6
          - type: custom:mushroom-entity-card
            entity: sensor.last_boot
            name: Letzter Boot
            icon: mdi:restart
            grid_options:
              columns: 6
          - type: custom:mushroom-entity-card
            entity: sensor.system_since_last_boot
            name: Uptime
            icon: mdi:timer-outline
            grid_options:
              columns: 6

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Verlauf
            heading_style: title
            icon: mdi:chart-timeline-variant
          - type: custom:apexcharts-card
            apex_config: !include templates/apexcharts_standard.yaml
            header:
              show: true
              title: Prozessorlast (2h)
            graph_span: 2h
            series:
              - entity: sensor.processor_use
                name: Prozessor
                type: line
                color: "#4C9EEB"  # token: --zs7-accent

          - type: custom:apexcharts-card
            apex_config: !include templates/apexcharts_standard.yaml
            header:
              show: true
              title: Kerne (2h)
            graph_span: 2h
            series:
              - entity: sensor.processor_use_core_0
                name: Core 0
                type: line
                color: "#F5B942"  # token: --zs7-pv
              - entity: sensor.processor_use_core_1
                name: Core 1
                type: line
                color: "#E0584C"  # token: --zs7-grid-import
              - entity: sensor.processor_use_core_2
                name: Core 2
                type: line
                color: "#3FB96B"  # token: --zs7-grid-export
              - entity: sensor.processor_use_core_3
                name: Core 3
                type: line
                color: "#9B6DE0"  # token: --zs7-battery

          - type: custom:apexcharts-card
            apex_config: !include templates/apexcharts_standard.yaml
            header:
              show: true
              title: Speichernutzung (2h)
            graph_span: 2h
            series:
              - entity: sensor.memory_usage
                name: Speicher
                type: line
                color: "#4C9EEB"  # token: --zs7-accent

          - type: custom:apexcharts-card
            apex_config: !include templates/apexcharts_standard.yaml
            header:
              show: true
              title: Festplatte frei / (48h)
            graph_span: 48h
            series:
              - entity: sensor.disk_free
                name: Frei
                type: line
                color: "#4C9EEB"  # token: --zs7-accent

          - type: custom:apexcharts-card
            apex_config: !include templates/apexcharts_standard.yaml
            header:
              show: true
              title: Prozessortemperatur (2h)
            graph_span: 2h
            series:
              - entity: sensor.processor_temperature
                name: Temperatur
                type: line
                color: "#E08A3C"  # token: --zs7-heat

      - type: grid
        cards:
          - type: heading
            heading: Releases
            heading_style: title
            icon: mdi:rocket-launch-outline
          - type: markdown
            title: Projekt Report
            content: |
              <small>Dokumentativer Report der aktuellen Deploy-Metadaten.</small>

              {%- set projects = state_attr('sensor.ha_config_deploy_overview', 'projects') or [] -%}
              {%- if projects | count == 0 -%}
              _Keine Deploy-Daten verfuegbar. Ein Deploy mit dem aktuellen Skript erzeugt die Metadaten._
              {%- else -%}
              | Projekt | Version | Erstellt | Letzter Deploy | Branch |
              |---------|---------|----------|----------------|--------|
              {%- for p in projects %}
              | {{ p.project_id }} | `{{ p.version }}` | {{ p.created_at_local | default('—') }} | {{ p.deployed_at_local | default('—') }} | {{ p.branch }} |
              {%- endfor -%}
              {%- endif -%}

          - !include releases_card.yaml

      - type: grid
        cards:
          - type: heading
            heading: API Status
            heading_style: title
            icon: mdi:cloud-outline
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.api_health_overall') }}"
            secondary: Gesamtstatus externe Schnittstellen
            icon: mdi:cloud-outline
            icon_color: >-
              {% set s = states('sensor.api_health_overall') %}
              {% if s == 'failed' %}var(--zs7-crit)
              {% elif s == 'degraded' %}var(--zs7-warn)
              {% elif s == 'ok' %}var(--zs7-ok)
              {% else %}var(--zs7-offline){% endif %}
            grid_options:
              columns: 12

          - type: custom:mushroom-template-card
            primary: Open-Meteo
            secondary: >-
              {{ states('sensor.api_health_open_meteo') }} ·
              {{ state_attr('sensor.api_health_open_meteo', 'last_success') | default('—') }}
            icon: mdi:weather-partly-cloudy
            icon_color: >-
              {% set s = states('sensor.api_health_open_meteo') %}
              {% if s == 'failed' %}var(--zs7-crit)
              {% elif s == 'degraded' %}var(--zs7-warn)
              {% elif s == 'ok' %}var(--zs7-ok)
              {% else %}var(--zs7-offline){% endif %}
            grid_options:
              columns: 6

          - type: custom:mushroom-template-card
            primary: AlphaESS
            secondary: >-
              {{ states('sensor.api_health_alphaess') }} ·
              {{ state_attr('sensor.api_health_alphaess', 'last_success') | default('—') }}
            icon: mdi:solar-power-variant-outline
            icon_color: >-
              {% set s = states('sensor.api_health_alphaess') %}
              {% if s == 'failed' %}var(--zs7-crit)
              {% elif s == 'degraded' %}var(--zs7-warn)
              {% elif s == 'ok' %}var(--zs7-ok)
              {% else %}var(--zs7-offline){% endif %}
            grid_options:
              columns: 6

          - type: custom:mushroom-template-card
            primary: DWD
            secondary: >-
              {{ states('sensor.api_health_dwd') }} ·
              {{ state_attr('sensor.api_health_dwd', 'last_success') | default('—') }}
            icon: mdi:weather-lightning
            icon_color: >-
              {% set s = states('sensor.api_health_dwd') %}
              {% if s == 'failed' %}var(--zs7-crit)
              {% elif s == 'degraded' %}var(--zs7-warn)
              {% elif s == 'ok' %}var(--zs7-ok)
              {% else %}var(--zs7-offline){% endif %}
            grid_options:
              columns: 6

          - type: custom:mushroom-template-card
            primary: SmartPlug
            secondary: >-
              {{ states('sensor.api_health_smartplug') }} ·
              {{ state_attr('sensor.api_health_smartplug', 'last_success') | default('—') }}
            icon: mdi:power-plug-outline
            icon_color: >-
              {% set s = states('sensor.api_health_smartplug') %}
              {% if s == 'failed' %}var(--zs7-crit)
              {% elif s == 'degraded' %}var(--zs7-warn)
              {% elif s == 'ok' %}var(--zs7-ok)
              {% else %}var(--zs7-offline){% endif %}
            grid_options:
              columns: 6

  - title: Zirkulation
    type: sections
    theme: zs7
    path: zirkulation
    icon: mdi:heat-pump-outline
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Zirkulation
            subtitle: Warmwasser-Zirkulationspumpe · SwitchBot Plug

          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.zs7_plug_circ_pump_error
                state: "on"
            card:
              type: custom:mushroom-template-card
              primary: Plug Verbindungsfehler
              secondary: >-
                Der gewaehlte Plug ist nicht erreichbar. Die Pumpe konnte nicht
                geschaltet werden. Prüfe die Verbindung oder den Plug.
              icon: mdi:alert-circle-outline
              icon_color: var(--zs7-crit)

      - type: grid
        title: Steuerung
        cards:
          - type: custom:mushroom-entity-card
            entity: input_select.zs7_circ_pump_switch
            name: Switchbot Plug
            icon: mdi:power-plug-outline

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_boolean.zs7_circ_pump_enabled
              name: Steuerung aktivieren
              icon: mdi:power-plug-outline
              tap_action:
                action: more-info
              hold_action:
                action: toggle

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_boolean.zs7_circ_window_enabled
              name: Zeitfenster aktivieren
              icon: mdi:clock-outline
              tap_action:
                action: more-info
              hold_action:
                action: toggle

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_boolean.zs7_circ_flush_enabled
              name: Durchspülung aktivieren
              icon: mdi:water-outline
              tap_action:
                action: more-info
              hold_action:
                action: toggle

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_number.zs7_circ_runtime_minutes
              name: Laufzeit pro Aktivierung

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_number.zs7_circ_pause_minutes
              name: Pause zwischen Aktivierungen

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_number.zs7_circ_flush_runtime_minutes
              name: Laufzeit pro Durchspülung

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_number.zs7_circ_flush_interval_minutes
              name: Pause vor Durchspülung

      - type: grid
        title: Status
        cards:
          - type: custom:mushroom-entity-card
            entity: binary_sensor.zs7_circ_pump_running
            name: Pumpe läuft
            icon: mdi:heat-pump-outline

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: binary_sensor.zs7_circ_window_active
              name: Zeitfenster aktiv
              icon: mdi:calendar-clock-outline

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: binary_sensor.zs7_circ_pump_should_run
              name: Pumpe soll laufen (Zeitfenster)
              icon: mdi:heat-pump-outline

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: binary_sensor.zs7_circ_flush_running
              name: Durchspülung läuft
              icon: mdi:water-outline

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: sensor.zs7_circ_selected_switch_state
              name: Aktueller Plug-Status

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: sensor.zs7_circ_next_cycle_label
              name: Nächster Pumpenlauf
              icon: mdi:clock-outline

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: sensor.zs7_circ_next_activation
              name: Nächste Aktivierung
              icon: mdi:clock-outline

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: timer.zs7_circ_flush_timer
              name: Durchspülung Timer
              icon: mdi:timer-outline

      - type: grid
        title: Zeitfenster
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_datetime.zs7_circ_window_1_start
              name: Fenster 1 Start

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_datetime.zs7_circ_window_1_end
              name: Fenster 1 Ende

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_datetime.zs7_circ_window_2_start
              name: Fenster 2 Start

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_datetime.zs7_circ_window_2_end
              name: Fenster 2 Ende

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_datetime.zs7_circ_window_3_start
              name: Fenster 3 Start

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_datetime.zs7_circ_window_3_end
              name: Fenster 3 Ende

      - type: grid
        title: Verbrauch
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: sensor.zs7_plug_circ_pump_power
              name: Aktuelle Leistung

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: sensor.zs7_plug_circ_pump_energy
              name: Gesamtverbrauch

      - type: grid
        title: Verlauf & Logbuch
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.zs7_circ_pump_enabled
                state: "on"
            card:
              type: custom:apexcharts-card
              apex_config: !include templates/apexcharts_standard.yaml
              header:
                show: true
                title: Pumpen-Status (24h)
              graph_span: 24h
              series:
                - entity: binary_sensor.zs7_circ_pump_should_run
                  name: Soll-Zustand
                  type: area
                  curve: stepline
                  opacity: 0.4
                  transform: "return x === 'on' ? 1 : 0;"
                  color: "#4CB8E0"  # token: --zs7-water
                - entity: sensor.zs7_circ_selected_switch_state
                  name: Ist-Zustand
                  type: area
                  curve: stepline
                  opacity: 0.4
                  transform: "return x === 'on' ? 1 : 0;"
                  color: "#3FB96B"  # token: --zs7-ok

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: logbook
              title: Ereignis-Log
              hours_to_show: 24
              refresh_interval: 60
              entities:
                - entity: binary_sensor.zs7_circ_pump_should_run
                  name: Soll-Zustand
                - entity: sensor.zs7_circ_selected_switch_state
                  name: Ist-Zustand
                - entity: input_boolean.zs7_circ_pump_enabled
                  name: Steuerung
                - entity: binary_sensor.zs7_circ_window_active
                  name: Zeitfenster

  - title: Status
    type: sections
    theme: zs7
    path: status
    icon: mdi:clipboard-check-outline
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Status
            subtitle: Drucker · Heizung · PV-Anlage

      - type: grid
        title: Drucker
        cards:
          - type: custom:mushroom-template-card
            primary: >-
              {% set details = state_attr('sensor.printerstatus_supply_alert_summary', 'details') %}
              {% set details_text = details if details not in [none, '', 'unknown', 'unavailable'] else '' %}
              {% set details_lc = details_text | lower %}
              {% set first_hint = details_text.split(', ')[0] if details_text else '' %}
              {% if details_text == '' or details_text == 'Keine Bedarfsmeldungen' %}
              OK — alles in Ordnung
              {% elif 'leer' in details_lc or 'kritisch' in details_lc or 'replace' in details_lc %}
              Fehler — {{ first_hint }}
              {% else %}
              Warnung — {{ first_hint }}
              {% endif %}
            secondary: Brother HL-3142CW · Bedarfsmeldungen
            icon: mdi:printer-outline
            icon_color: >-
              {% set details = state_attr('sensor.printerstatus_supply_alert_summary', 'details') %}
              {% set details_text = details if details not in [none, '', 'unknown', 'unavailable'] else '' %}
              {% set details_lc = details_text | lower %}
              {% if 'leer' in details_lc or 'kritisch' in details_lc or 'replace' in details_lc %}
              var(--zs7-crit)
              {% elif details_text == '' or details_text == 'Keine Bedarfsmeldungen' %}
              var(--zs7-ok)
              {% else %}
              var(--zs7-warn)
              {% endif %}

          - type: heading
            heading: Druckerstatus
            heading_style: title
            icon: mdi:printer-outline
          - type: custom:mushroom-entity-card
            entity: sensor.brother_hl_3142cw_series
            name: Drucker
            grid_options:
              columns: 6
          - type: custom:mushroom-entity-card
            entity: sensor.hl_3142cw_status
            name: Status
            grid_options:
              columns: 6
          - type: custom:mushroom-entity-card
            entity: sensor.hl_3142cw_seitenzahler
            name: Seitenzaehler
            grid_options:
              columns: 6
          - type: custom:mushroom-entity-card
            entity: sensor.printerstatus_supply_alert_summary
            name: Bedarfsmeldungen
            grid_options:
              columns: 6
          - type: custom:mushroom-entity-card
            entity: sensor.printerstatus_supply_alert_count
            name: Anzahl Bedarfsmeldungen
            grid_options:
              columns: 6

          - type: custom:mushroom-entity-card
            entity: sensor.printerstatus_toner_black_percent
            name: Schwarz Toner
          - type: custom:mushroom-entity-card
            entity: sensor.printerstatus_toner_cyan_percent
            name: Cyan Toner
          - type: custom:mushroom-entity-card
            entity: sensor.printerstatus_toner_magenta_percent
            name: Magenta Toner
          - type: custom:mushroom-entity-card
            entity: sensor.printerstatus_toner_yellow_percent
            name: Gelb Toner

          - type: heading
            heading: Lebensdauer Trommeln
            heading_style: title
            icon: mdi:printer-outline
          - type: custom:mushroom-entity-card
            entity: sensor.hl_3142cw_restlebensdauer_der_schwarz_trommel
            name: Schwarz Trommel
            grid_options:
              columns: 6
          - type: custom:mushroom-entity-card
            entity: sensor.hl_3142cw_restlebensdauer_der_cyan_trommel
            name: Cyan Trommel
            grid_options:
              columns: 6
          - type: custom:mushroom-entity-card
            entity: sensor.hl_3142cw_restlebensdauer_der_magenta_trommel
            name: Magenta Trommel
            grid_options:
              columns: 6
