            content: >-
              {% set capacity = states('sensor.alphaess_battery_usable_capacity_estimated') | float(none) %}
              {% set energy_90 = state_attr('sensor.alphaess_battery_usable_capacity_estimated', 'energy_at_90_pct_kwh') | float(none) %}
              {% set energy_100 = state_attr('sensor.alphaess_battery_usable_capacity_estimated', 'energy_at_100_pct_kwh') | float(none) %}
              {% set energy_105 = state_attr('sensor.alphaess_battery_usable_capacity_estimated', 'energy_at_105_pct_kwh') | float(none) %}
              {% if capacity is none or energy_90 is none or energy_100 is none or energy_105 is none %}
              <small>Bandbreiten werden geladen.</small>
              {% else %}
              <small>
              - 20-90% (linear): {{ (((energy_90 - (capacity * 0.2)) / 70.0) | round(3) | string) | replace('.', ',') }} kWh je Prozent<br>
              - 90-100%: {{ (((energy_100 - energy_90) / 10.0) | round(3) | string) | replace('.', ',') }} kWh je Prozent<br>
              - 100-105% (Top-off): {{ (((energy_105 - energy_100) / 5.0) | round(3) | string) | replace('.', ',') }} kWh je Prozent
