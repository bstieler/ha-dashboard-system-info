title: System
views:
  - title: System
    type: sections
    theme: zs7
    path: system-info
    icon: mdi:server-outline
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: System
            subtitle: Raspberry Pi · Releases · API Status

      - type: grid
        title: Raspberry Pi
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.processor_use
            name: Prozessorlast
          - type: custom:mushroom-entity-card
            entity: sensor.processor_temperature
            name: Prozessortemperatur
          - type: custom:mushroom-entity-card
            entity: sensor.memory_usage
            name: Speichernutzung
          - type: custom:mushroom-entity-card
            entity: sensor.disk_free
            name: Festplatte frei (/)
          - type: custom:mushroom-entity-card
            entity: sensor.last_boot
            name: Letzter Boot
          - type: custom:mushroom-entity-card
            entity: sensor.system_since_last_boot
            name: Uptime

      - type: grid
        title: Verlauf
        cards:
          - type: custom:apexcharts-card
            apex_config: !include templates/apexcharts_standard.yaml
            header:
              show: true
              title: Prozessorlast (2h)
            graph_span: 2h
            series:
              - entity: sensor.processor_use
                name: Prozessor
                type: line
                color: var(--zs7-accent)

          - type: custom:apexcharts-card
            apex_config: !include templates/apexcharts_standard.yaml
            header:
              show: true
              title: Kerne (2h)
            graph_span: 2h
            series:
              - entity: sensor.processor_use_core_0
                name: Core 0
                type: line
                color: var(--zs7-pv)
              - entity: sensor.processor_use_core_1
                name: Core 1
                type: line
                color: var(--zs7-grid-import)
              - entity: sensor.processor_use_core_2
                name: Core 2
                type: line
                color: var(--zs7-grid-export)
              - entity: sensor.processor_use_core_3
                name: Core 3
                type: line
                color: var(--zs7-battery)

          - type: custom:apexcharts-card
            apex_config: !include templates/apexcharts_standard.yaml
            header:
              show: true
              title: Speichernutzung (2h)
            graph_span: 2h
            series:
              - entity: sensor.memory_usage
                name: Speicher
                type: line
                color: var(--zs7-accent)

          - type: custom:apexcharts-card
            apex_config: !include templates/apexcharts_standard.yaml
            header:
              show: true
              title: Festplatte frei / (48h)
            graph_span: 48h
            series:
              - entity: sensor.disk_free
                name: Frei
                type: line
                color: var(--zs7-accent)

          - type: custom:apexcharts-card
            apex_config: !include templates/apexcharts_standard.yaml
            header:
              show: true
              title: Prozessortemperatur (2h)
            graph_span: 2h
            series:
              - entity: sensor.processor_temperature
                name: Temperatur
                type: line
                color: var(--zs7-heat)

      - type: grid
        title: Releases
        cards:
          - type: markdown
            title: Projekt Overview
            content: |
              {%- set projects = state_attr('sensor.ha_config_deploy_overview', 'projects') or [] -%}
              {%- if projects | count == 0 -%}
              _Keine Deploy-Daten verfuegbar. Ein Deploy mit dem aktuellen Skript erzeugt die Metadaten._
              {%- else -%}
              | Projekt | Version | Erstellt | Letzter Deploy | Branch |
              |---------|---------|----------|----------------|--------|
              {%- for p in projects %}
              | {{ p.project_id }} | `{{ p.version }}` | {{ p.created_at_local | default('—') }} | {{ p.deployed_at_local | default('—') }} | {{ p.branch }} |
              {%- endfor -%}
              {%- endif -%}

          - !include releases_card.yaml

      - type: grid
        title: API Status
        cards:
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.api_health_overall') }}"
            secondary: Gesamtstatus externe Schnittstellen
            icon: mdi:cloud-outline
            icon_color: >-
              {% set s = states('sensor.api_health_overall') %}
              {% if s == 'failed' %}var(--zs7-crit)
              {% elif s == 'degraded' %}var(--zs7-warn)
              {% elif s == 'ok' %}var(--zs7-ok)
              {% else %}var(--zs7-offline){% endif %}

          - type: markdown
            title: External Connections
            content: |
              {%- set sources = [
                ('Open-Meteo', 'sensor.api_health_open_meteo'),
                ('AlphaESS', 'sensor.api_health_alphaess'),
                ('DWD', 'sensor.api_health_dwd'),
                ('SwitchBot BLE', 'sensor.api_health_switchbot_ble')
              ] -%}
              | Service | Status | Last Call | Last Success | Details |
              |:--------|:------:|:---------:|:------------:|:--------|
              {%- for name, entity in sources %}
              {%- set status = states(entity) | default('unknown') %}
              {%- set icon = '🔴' if status == 'failed' else '🟡' if status == 'degraded' else '🟢' if status == 'ok' else '⚪' %}
              {%- set last_call = state_attr(entity, 'last_call') | default('—') %}
              {%- set last_success = state_attr(entity, 'last_success') | default('—') %}
              {%- set details = state_attr(entity, 'details') | default('—') | truncate(45) %}
              | {{ name }} | {{ icon }} {{ status }} | {{ last_call }} | {{ last_success }} | {{ details }} |
              {%- endfor %}

  - title: Zirkulation
    type: sections
    theme: zs7
    path: zirkulation
    icon: mdi:heat-pump-outline
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Zirkulation
            subtitle: Warmwasser-Zirkulationspumpe · SwitchBot Plug

          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.zs7_circ_pump_ble_error
                state: "on"
            card:
              type: custom:mushroom-template-card
              primary: BLE Verbindungsfehler
              secondary: >-
                Der SwitchBot Plug ist nicht erreichbar. Die Pumpe konnte nicht
                geschaltet werden. Prüfe die Bluetooth-Verbindung oder den Plug.
              icon: mdi:alert-circle-outline
              icon_color: var(--zs7-crit)

      - type: grid
        title: Steuerung
        cards:
          - type: custom:mushroom-entity-card
            entity: input_select.zs7_circ_pump_switch
            name: Switchbot Plug
            icon: mdi:power-plug-outline

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_boolean.zs7_circ_pump_enabled
              name: Steuerung aktivieren
              icon: mdi:power
              tap_action:
                action: more-info
              hold_action:
                action: toggle

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_boolean.zs7_circ_window_enabled
              name: Zeitfenster aktivieren
              icon: mdi:calendar-clock-outline
              tap_action:
                action: more-info
              hold_action:
                action: toggle

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_boolean.zs7_circ_flush_enabled
              name: Durchspülung aktivieren
              icon: mdi:water-sync
              tap_action:
                action: more-info
              hold_action:
                action: toggle

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_number.zs7_circ_runtime_minutes
              name: Laufzeit pro Aktivierung

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_number.zs7_circ_pause_minutes
              name: Pause zwischen Aktivierungen

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_number.zs7_circ_flush_runtime_minutes
              name: Laufzeit pro Durchspülung

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_number.zs7_circ_flush_interval_minutes
              name: Pause vor Durchspülung

      - type: grid
        title: Status
        cards:
          - type: custom:mushroom-entity-card
            entity: binary_sensor.zs7_circ_pump_running
            name: Pumpe läuft
            icon: mdi:heat-pump-outline

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: binary_sensor.zs7_circ_window_active
              name: Zeitfenster aktiv
              icon: mdi:calendar-clock-outline

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: binary_sensor.zs7_circ_pump_should_run
              name: Pumpe soll laufen (Zeitfenster)
              icon: mdi:heat-pump-outline

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: binary_sensor.zs7_circ_flush_running
              name: Durchspülung läuft
              icon: mdi:water-sync

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: sensor.zs7_circ_selected_switch_state
              name: Aktueller Plug-Status

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: sensor.zs7_circ_next_cycle_label
              name: Nächster Pumpenlauf
              icon: mdi:clock-outline

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: sensor.zs7_circ_next_activation
              name: Nächste Aktivierung
              icon: mdi:clock-outline

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: timer.zs7_circ_flush_timer
              name: Durchspülung Timer
              icon: mdi:timer-outline

      - type: grid
        title: Zeitfenster
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_datetime.zs7_circ_window_1_start
              name: Fenster 1 Start

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_datetime.zs7_circ_window_1_end
              name: Fenster 1 Ende

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_datetime.zs7_circ_window_2_start
              name: Fenster 2 Start

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_datetime.zs7_circ_window_2_end
              name: Fenster 2 Ende

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_datetime.zs7_circ_window_3_start
              name: Fenster 3 Start

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: input_datetime.zs7_circ_window_3_end
              name: Fenster 3 Ende

      - type: grid
        title: Verbrauch
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: sensor.plug_mini_eu_4392_leistung
              name: Aktuelle Leistung

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: custom:mushroom-entity-card
              entity: sensor.plug_mini_eu_4392_energie
              name: Gesamtverbrauch

      - type: grid
        title: Verlauf & Logbuch
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.zs7_circ_pump_enabled
                state: "on"
            card:
              type: history-graph
              title: Pumpen-Status (24h)
              hours_to_show: 24
              refresh_interval: 60
              entities:
                - entity: binary_sensor.zs7_circ_pump_should_run
                  name: Soll-Zustand
                - entity: sensor.zs7_circ_selected_switch_state
                  name: Ist-Zustand

          - type: conditional
            conditions:
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unknown"
              - condition: state
                entity: input_select.zs7_circ_pump_switch
                state_not: "unavailable"
            card:
              type: logbook
              title: Ereignis-Log
              hours_to_show: 24
              refresh_interval: 60
              entities:
                - entity: binary_sensor.zs7_circ_pump_should_run
                  name: Soll-Zustand
                - entity: sensor.zs7_circ_selected_switch_state
                  name: Ist-Zustand
                - entity: input_boolean.zs7_circ_pump_enabled
                  name: Steuerung
                - entity: binary_sensor.zs7_circ_window_active
                  name: Zeitfenster

  - title: Status
    type: sections
    theme: zs7
    path: status
    icon: mdi:clipboard-check-outline
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-title-card
            title: Status
            subtitle: Drucker · Heizung · PV-Anlage

      - type: grid
        title: Drucker
        cards:
          - type: custom:mushroom-template-card
            primary: >-
              {% set details = state_attr('sensor.printerstatus_supply_alert_summary', 'details') %}
              {% set details_text = details if details not in [none, '', 'unknown', 'unavailable'] else '' %}
              {% set details_lc = details_text | lower %}
              {% set first_hint = details_text.split(', ')[0] if details_text else '' %}
              {% if details_text == '' or details_text == 'Keine Bedarfsmeldungen' %}
              OK — alles in Ordnung
              {% elif 'leer' in details_lc or 'kritisch' in details_lc or 'replace' in details_lc %}
              Fehler — {{ first_hint }}
              {% else %}
              Warnung — {{ first_hint }}
              {% endif %}
            secondary: Brother HL-3142CW · Bedarfsmeldungen
            icon: mdi:printer-outline
            icon_color: >-
              {% set details = state_attr('sensor.printerstatus_supply_alert_summary', 'details') %}
              {% set details_text = details if details not in [none, '', 'unknown', 'unavailable'] else '' %}
              {% set details_lc = details_text | lower %}
              {% if 'leer' in details_lc or 'kritisch' in details_lc or 'replace' in details_lc %}
              var(--zs7-crit)
              {% elif details_text == '' or details_text == 'Keine Bedarfsmeldungen' %}
              var(--zs7-ok)
              {% else %}
              var(--zs7-warn)
              {% endif %}

          - type: entities
            title: Druckerstatus
            show_header_toggle: false
            entities:
              - entity: sensor.brother_hl_3142cw_series
                name: Drucker
              - entity: sensor.hl_3142cw_status
                name: Status
              - entity: sensor.hl_3142cw_seitenzahler
                name: Seitenzaehler
              - entity: sensor.printerstatus_supply_alert_summary
                name: Bedarfsmeldungen
              - entity: sensor.printerstatus_supply_alert_count
                name: Anzahl Bedarfsmeldungen

          - type: custom:mushroom-entity-card
            entity: sensor.printerstatus_toner_black_percent
            name: Schwarz Toner
          - type: custom:mushroom-entity-card
            entity: sensor.printerstatus_toner_cyan_percent
            name: Cyan Toner
          - type: custom:mushroom-entity-card
            entity: sensor.printerstatus_toner_magenta_percent
            name: Magenta Toner
          - type: custom:mushroom-entity-card
            entity: sensor.printerstatus_toner_yellow_percent
            name: Gelb Toner

          - type: entities
            title: Lebensdauer Trommeln
            show_header_toggle: false
            entities:
              - entity: sensor.hl_3142cw_restlebensdauer_der_schwarz_trommel
                name: Schwarz Trommel
              - entity: sensor.hl_3142cw_restlebensdauer_der_cyan_trommel
                name: Cyan Trommel
              - entity: sensor.hl_3142cw_restlebensdauer_der_magenta_trommel
                name: Magenta Trommel
              - entity: sensor.hl_3142cw_restlebensdauer_der_gelb_trommel
                name: Gelb Trommel

          - type: entities
            title: Lebensdauer Komponenten
            show_header_toggle: false
            entities:
              - entity: sensor.hl_3142cw_restlebensdauer_der_bandeinheit
                name: Bandeinheit
              - entity: sensor.hl_3142cw_restlebensdauer_der_fixiereinheit
                name: Fixiereinheit
              - entity: sensor.hl_3142cw_restlebensdauer_des_pf_kit_1
                name: PF Kit 1

      - type: grid
        title: Heizung (Tado)
        cards:
          - type: custom:mushroom-template-card
            primary: >-
              {% set devices = [
                {'id':'va3984081408', 'room':'Bad'},
                {'id':'va0428821760', 'room':'Arbeitszimmer'},
                {'id':'va4219555072', 'room':'Lenya'},
                {'id':'va2543013120', 'room':'Malin'},
                {'id':'va0244534528', 'room':'Malin'}
              ] %}
              {% set ns = namespace(level='OK', message='Alles in Ordnung.') %}
              {% for d in devices %}
                {% set cloud = states('binary_sensor.tado_smart_radiator_thermostat_' ~ d.id ~ '_cloud_verbindung') %}
                {% if ns.level != 'Fehler' and cloud != 'on' %}
                  {% set ns.level = 'Fehler' %}
                  {% if cloud in ['unknown', 'unavailable', 'none', ''] %}
                    {% set ns.message = 'Cloud-Verbindung unbekannt: ' ~ d.room ~ ' (' ~ (d.id | upper) ~ ')' %}
                  {% else %}
                    {% set ns.message = 'Cloud-Verbindung unterbrochen: ' ~ d.room ~ ' (' ~ (d.id | upper) ~ ')' %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {% if ns.level == 'OK' %}
                {% for d in devices %}
                  {% set battery = states('binary_sensor.tado_smart_radiator_thermostat_' ~ d.id ~ '_batterie') %}
                  {% if ns.level == 'OK' and battery == 'on' %}
                    {% set ns.level = 'Warnung' %}
                    {% set ns.message = 'Batterie-Warnung: ' ~ d.room ~ ' (' ~ (d.id | upper) ~ ')' %}
                  {% endif %}
                {% endfor %}
              {% endif %}
              {{ ns.level }} — {{ ns.message }}
            secondary: Tado Thermostate · Cloud und Batterien
            icon: mdi:home-thermometer-outline
            icon_color: >-
              {% set devices = [
                {'id':'va3984081408'},
                {'id':'va0428821760'},
                {'id':'va4219555072'},
                {'id':'va2543013120'},
                {'id':'va0244534528'}
              ] %}
              {% set ns = namespace(level='OK') %}
              {% for d in devices %}
                {% set cloud = states('binary_sensor.tado_smart_radiator_thermostat_' ~ d.id ~ '_cloud_verbindung') %}
                {% if ns.level != 'Fehler' and cloud != 'on' %}
                  {% set ns.level = 'Fehler' %}
                {% endif %}
              {% endfor %}
              {% if ns.level == 'OK' %}
                {% for d in devices %}
                  {% if is_state('binary_sensor.tado_smart_radiator_thermostat_' ~ d.id ~ '_batterie', 'on') %}
                    {% set ns.level = 'Warnung' %}
                  {% endif %}
                {% endfor %}
              {% endif %}
              {% if ns.level == 'Fehler' %}var(--zs7-crit)
              {% elif ns.level == 'Warnung' %}var(--zs7-warn)
              {% else %}var(--zs7-ok){% endif %}

          - type: custom:mushroom-entity-card
            entity: binary_sensor.tado_ib_z7_cloud_connection
            name: Tado Bridge Cloud
            icon: mdi:cloud-outline
          - type: custom:mushroom-entity-card
            entity: sensor.tado_z7_api_status
            name: Tado API Status
            icon: mdi:cloud-outline

          - type: custom:mushroom-template-card
