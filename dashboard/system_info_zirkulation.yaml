title: Zirkulation
type: sections
theme: zs7
path: zirkulation
icon: mdi:heat-pump-outline
max_columns: 3
sections:
  - type: grid
    cards:
      - type: custom:mushroom-title-card
        title: Zirkulation
        subtitle: Warmwasser-Zirkulationspumpe · SwitchBot Plug

      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.zs7_plug_circ_pump_error
            state: "on"
        card:
          type: custom:mushroom-template-card
          primary: Plug Verbindungsfehler
          secondary: >-
            Der gewaehlte Plug ist nicht erreichbar. Die Pumpe konnte nicht
            geschaltet werden. Prüfe die Verbindung oder den Plug.
          icon: mdi:alert-circle-outline
          icon_color: var(--zs7-crit)

  - type: grid
    cards:
      - type: heading
        heading: Steuerung
        heading_style: subtitle
      - type: custom:mushroom-entity-card
        entity: input_select.zs7_circ_pump_switch
        name: Switchbot Plug
        icon: mdi:power-plug-outline

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: input_boolean.zs7_circ_pump_enabled
          name: Steuerung aktivieren
          icon: mdi:power-plug-outline
          tap_action:
            action: more-info
          hold_action:
            action: toggle

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: input_boolean.zs7_circ_window_enabled
          name: Zeitfenster aktivieren
          icon: mdi:clock-outline
          tap_action:
            action: more-info
          hold_action:
            action: toggle

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: input_boolean.zs7_circ_boost_enabled
          name: Anwesenheits-Boost
          icon: mdi:home-account-outline
          tap_action:
            action: more-info
          hold_action:
            action: toggle

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-template-card
          primary: Anwesenheits-Boost – Info
          secondary: >-
            Pumpe läuft zwischen 06:00 und 23:00 Uhr zusätzlich zu den
            Zeitfenstern, wenn jemand zu Hause ist (Anwesenheitserkennung).
            Zeitfenster bleiben unverändert aktiv; der Boost ergänzt sie nur.
            Tippen für Details.
          icon: mdi:information-outline
          tap_action:
            action: more-info
            entity: binary_sensor.zs7_circ_presence_boost

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: input_boolean.zs7_circ_flush_enabled
          name: Durchspülung aktivieren
          icon: mdi:water-outline
          tap_action:
            action: more-info
          hold_action:
            action: toggle

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: input_number.zs7_circ_runtime_minutes
          name: Laufzeit pro Aktivierung

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: input_number.zs7_circ_pause_minutes
          name: Pause zwischen Aktivierungen

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: input_number.zs7_circ_flush_runtime_minutes
          name: Laufzeit pro Durchspülung

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: input_number.zs7_circ_flush_interval_minutes
          name: Pause vor Durchspülung

  - type: grid
    cards:
      - type: heading
        heading: Status
        heading_style: subtitle
      - type: custom:mushroom-entity-card
        entity: binary_sensor.zs7_circ_pump_running
        name: Pumpe läuft
        icon: mdi:heat-pump-outline

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: binary_sensor.zs7_circ_window_active
          name: Zeitfenster aktiv
          icon: mdi:calendar-clock-outline

      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.zs7_circ_boost_enabled
            state_not: "off"
        card:
          type: custom:mushroom-entity-card
          entity: binary_sensor.zs7_circ_presence_boost
          name: Anwesenheits-Boost aktiv
          icon: mdi:home-account-outline
          tap_action:
            action: more-info

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: binary_sensor.zs7_circ_pump_should_run
          name: Pumpe soll laufen (Zeitfenster)
          icon: mdi:heat-pump-outline

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: binary_sensor.zs7_circ_flush_running
          name: Durchspülung läuft
          icon: mdi:water-outline

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: sensor.zs7_circ_selected_switch_state
          name: Aktueller Plug-Status

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: sensor.zs7_circ_next_cycle_label
          name: Nächster Pumpenlauf
          icon: mdi:clock-outline

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: sensor.zs7_circ_next_activation
          name: Nächste Aktivierung
          icon: mdi:clock-outline

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: timer.zs7_circ_flush_timer
          name: Durchspülung Timer
          icon: mdi:timer-outline

  - type: grid
    cards:
      - type: heading
        heading: Zeitfenster
        heading_style: subtitle
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: input_datetime.zs7_circ_window_1_start
          name: Fenster 1 Start

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: input_datetime.zs7_circ_window_1_end
          name: Fenster 1 Ende

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: input_datetime.zs7_circ_window_2_start
          name: Fenster 2 Start

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: input_datetime.zs7_circ_window_2_end
          name: Fenster 2 Ende

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: input_datetime.zs7_circ_window_3_start
          name: Fenster 3 Start

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: input_datetime.zs7_circ_window_3_end
          name: Fenster 3 Ende

  - type: grid
    cards:
      - type: heading
        heading: Verbrauch
        heading_style: subtitle
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: sensor.zs7_plug_circ_pump_power
          name: Aktuelle Leistung

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: custom:mushroom-entity-card
          entity: sensor.zs7_plug_circ_pump_energy
          name: Gesamtverbrauch

  - type: grid
    cards:
      - type: heading
        heading: Verlauf & Logbuch
        heading_style: subtitle
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.zs7_circ_pump_enabled
            state: "on"
        card:
          type: custom:apexcharts-card
          apex_config: !include templates/apexcharts_standard.yaml
          header:
            show: true
            title: Pumpen-Status (6h)
          graph_span: 6h
          series:
            - entity: binary_sensor.zs7_circ_pump_should_run
              name: Soll-Zustand
              type: area
              curve: stepline
              opacity: 0.4
              transform: "return x === 'on' ? 1 : 0;"
              color: "#4CB8E0"  # token: --zs7-water
            - entity: sensor.zs7_circ_selected_switch_state
              name: Ist-Zustand
              type: area
              curve: stepline
              opacity: 0.4
              transform: "return x === 'on' ? 1 : 0;"
              color: "#3FB96B"  # token: --zs7-ok

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unknown"
          - condition: state
            entity: input_select.zs7_circ_pump_switch
            state_not: "unavailable"
        card:
          type: logbook
          title: Ereignis-Log
          hours_to_show: 24
          refresh_interval: 60
          entities:
            - entity: binary_sensor.zs7_circ_pump_should_run
              name: Soll-Zustand
            - entity: sensor.zs7_circ_selected_switch_state
              name: Ist-Zustand
            - entity: input_boolean.zs7_circ_pump_enabled
              name: Steuerung
            - entity: binary_sensor.zs7_circ_window_active
              name: Zeitfenster
