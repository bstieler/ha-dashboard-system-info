# Ruff configuration for ha-dashboard-system-info (STG-6.37).
# Mirrors the superproject configuration (ha-config/pyproject.toml) so lint
# results stay consistent whether Ruff runs from this repo or the superproject.
target-version = "py311"
line-length = 120

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
    # The formatter owns line breaking; long strings/YAML snippets stay as-is.
    "E501",
]

[lint.per-file-ignores]
# Tests and HA custom components bootstrap sys.path before importing project
# modules; module-level imports cannot be moved to the top there.
"*/tests/*" = ["E402"]
"test_*" = ["E402"]
"*/custom_components/*" = ["E402"]
